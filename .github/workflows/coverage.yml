name: coverage CI
on:
  push:
    branches: [main]
    paths:
      - "packages/**/*.ts"
      - "vitest.config.mts"
      - ".github/workflows/coverage.yml"

permissions:
  contents: read
  id-token: write # IMPORTANT

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@9b5745cdf0a2e8c2620f0746130f809adb911c19 # v4
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm run test

      - name: Run and publish code coverage
        uses: qltysh/qlty-action/coverage@fd52dc852530a708d68c3b7342f8d33d1df4cd55 # v2.2.1
        with:
          oidc: true
          files: coverage/lcov.info
